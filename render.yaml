# Render Blueprint for the FastAPI backend + managed PostgreSQL.
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: mediscan-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter            # OCR + XGBoost + PyTorch need >= 1-2 GB RAM; the free 512 MB plan is too small
    healthCheckPath: /health
    disk:
      name: mediscan-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mediscan-db, property: connectionString }
      - key: MEDISCAN_ENCRYPTION_KEY
        sync: false            # generate with: python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      - key: CORS_ORIGINS
        sync: false            # e.g. https://mediscan-ai.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: ENFORCE_HTTPS
        value: "true"
      - key: MEDISCAN_API_KEY
        sync: false
databases:
  - name: mediscan-db
    plan: basic-256mb
